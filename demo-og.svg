<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0a1018"/>
      <stop offset="50%" stop-color="#0d1828"/>
      <stop offset="100%" stop-color="#06101c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#00ffcc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="900" cy="200" r="380" fill="url(#glow)"/>
  <circle cx="200" cy="500" r="280" fill="url(#glow)" opacity="0.6"/>

  <!-- Subtle grid -->
  <g stroke="#172038" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105"  x2="1200" y2="105"/>
    <line x1="0" y1="210"  x2="1200" y2="210"/>
    <line x1="0" y1="315"  x2="1200" y2="315"/>
    <line x1="0" y1="420"  x2="1200" y2="420"/>
    <line x1="0" y1="525"  x2="1200" y2="525"/>
  </g>

  <!-- Shield icon -->
  <g transform="translate(80, 80)" filter="url(#softShadow)">
    <path d="M 60 0 L 120 22 L 120 80 Q 120 130 60 160 Q 0 130 0 80 L 0 22 Z"
          fill="#00ffcc" opacity="0.95"/>
    <path d="M 60 0 L 120 22 L 120 80 Q 120 130 60 160 Q 0 130 0 80 L 0 22 Z"
          fill="none" stroke="#0a1018" stroke-width="3"/>
    <path d="M 35 75 L 55 95 L 90 55"
          fill="none" stroke="#0a1018" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand -->
  <text x="240" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" fill="#ffffff" letter-spacing="0.5">
    ScamAlert
  </text>
  <text x="240" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="400" fill="#6e7c91" letter-spacing="2">
    WORLD WIDE
  </text>

  <!-- Main headline -->
  <text x="80" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Is this a scam?
  </text>
  <text x="80" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="800" fill="#00ffcc" letter-spacing="-1">
    Find out in 5 seconds.
  </text>

  <!-- Subtext -->
  <text x="80" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#a8b6c8">
    AI checks suspicious messages, links &amp; phone numbers — free, no signup.
  </text>

  <!-- Pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <g transform="translate(80, 530)">
      <rect width="220" height="48" rx="24" fill="#0d1620" stroke="#172038" stroke-width="2"/>
      <text x="22" y="32" fill="#00ffcc">🌍</text>
      <text x="56" y="32" fill="#e6edf3">Every language</text>
    </g>
    <g transform="translate(320, 530)">
      <rect width="180" height="48" rx="24" fill="#0d1620" stroke="#172038" stroke-width="2"/>
      <text x="22" y="32" fill="#00ffcc">⚡</text>
      <text x="56" y="32" fill="#e6edf3">5-second AI</text>
    </g>
    <g transform="translate(520, 530)">
      <rect width="200" height="48" rx="24" fill="#0d1620" stroke="#172038" stroke-width="2"/>
      <text x="22" y="32" fill="#00ffcc">🔒</text>
      <text x="56" y="32" fill="#e6edf3">No signup</text>
    </g>
  </g>

  <!-- URL chip bottom-right -->
  <g transform="translate(820, 540)">
    <rect width="320" height="48" rx="10" fill="#00ffcc"/>
    <text x="160" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" fill="#0a1018" text-anchor="middle">
      scamalert-app.up.railway.app
    </text>
  </g>
</svg>
